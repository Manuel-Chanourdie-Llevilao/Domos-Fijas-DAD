<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Mapa - Cámaras Domo | División Anillo Digital</title>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {  
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        .slide-panel {
            position: fixed;
            top: 0;
            right: -480px;
            width: 440px;
            max-width: 92vw;
            height: 100%;
            background: rgba(10, 20, 30, 0.97);
            backdrop-filter: blur(16px);
            box-shadow: -5px 0 30px rgba(0,0,0,0.5);
            z-index: 2000;
            transition: right 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-left: 1px solid rgba(255, 170, 51, 0.5);
        }
        .slide-panel.open {
            right: 0;
        }
        .panel-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, #001a33 0%, #002b4f 100%);
            border-bottom: 2px solid #ffaa33;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            gap: 12px;
        }
        .header-title h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffaa33;
            margin: 0;
            line-height: 1.3;
        }
        .close-panel {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.2s;
        }
        .close-panel:hover {
            background: rgba(255,255,255,0.3);
            color: #ffaa33;
        }
        .panel-content {
            padding: 20px;
            flex: 1;
        }
        .domo-info {
            background: rgba(0,0,0,0.5);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            border-left: 4px solid #ffaa33;
        }
        .domo-info h3 {
            color: #ffaa33;
            margin-bottom: 12px;
            font-size: 1.2rem;
        }
        .domo-info p {
            margin: 8px 0;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .fijas-section {
            margin-top: 10px;
        }
        .fijas-section h4 {
            color: #7ec8ff;
            margin: 15px 0 12px 0;
            border-bottom: 1px solid #3a5a7a;
            padding-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
        }
        .fija-card {
            background: rgba(40,55,70,0.7);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 12px;
            transition: 0.1s;
            border-left: 3px solid #2c7bb6;
        }
        .fija-card strong {
            color: #ffaa66;
            display: block;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        .fija-card p {
            margin: 5px 0;
            font-size: 0.85rem;
            color: #ddd;
        }
        .badge {
            display: inline-block;
            background: #2c7bb6;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-left: 8px;
        }
        .sentido-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-left: 8px;
        }
        .sentido-rio {
            background: #2c7bb6;
        }
        .sentido-riachuelo {
            background: #6a1b9a;
        }
        .movil-badge {
            display: inline-block;
            background: #d73027;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-left: 8px;
        }
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 40px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            z-index: 1000;
            pointer-events: none;
            font-family: monospace;
            border-left: 3px solid #ffaa33;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(5px);
            padding: 10px 18px;
            border-radius: 28px;
            color: white;
            font-size: 12px;
            z-index: 1000;
            display: flex;
            gap: 20px;
            font-family: monospace;
            pointer-events: none;
            flex-wrap: wrap;
        }
        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .legend i.domo {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #d73027;
            border-radius: 50%;
            box-shadow: 0 0 2px white;
        }
        @media (max-width: 550px) {
            .slide-panel { width: 100%; right: -100%; }
            .panel-header { padding: 12px 16px; }
            .header-title h2 { font-size: 0.9rem; }
            .info-panel { font-size: 9px; top: 10px; left: 10px; }
            .legend { font-size: 9px; bottom: 10px; left: 10px; gap: 12px; }
        }
        .slide-panel::-webkit-scrollbar {
            width: 5px;
        }
        .slide-panel::-webkit-scrollbar-track {
            background: #1e2a32;
        }
        .slide-panel::-webkit-scrollbar-thumb {
            background: #ffaa33;
            border-radius: 5px;
        }
    </style>
</head>

            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> & CartoDB',

            crossOrigin: true

            maxZoom: 19,
            crossOrigin: true
        });

        let cartoTileErrors = 0;
        cartoLayer.on('tileerror', () => {

            const html = `
                <div class="domo-info">
                    <h3>🏢 ${domo.nombre} <span class="movil-badge">Móvil 360°</span></h3>
                    <p><strong>📍 Dirección:</strong> ${domo.direccion}</p>
                    <p><strong>📐 Coordenadas:</strong> ${domo.lat}, ${domo.lng}</p>
                    <p><strong>🎥 Tipo:</strong> Cámara Domo (PTZ) - Visión panorámica 360°</p>
                </div>
                ${fijasHtml}
                <p style="font-size:0.7rem; margin-top:20px; text-align:center; border-top:1px solid #3a5a7a; padding-top:12px;">🔍 División Anillo Digital - Datos actualizados 27/03/2026</p>
            `;
            panelContent.innerHTML = html;
            panel.classList.add('open');
        }

        function closePanel() {
            panel.classList.remove('open');
        }

        closeBtn.addEventListener('click', closePanel);
        
        // Cerrar panel al hacer clic en el mapa
        map.on('click', function() {
            if (panel.classList.contains('open')) {
                closePanel();
            }
        });

        // Agregar SOLO marcadores de DOMOS al mapa
        puntosTriple.forEach(domo => {
            const marker = L.marker([domo.lat, domo.lng], { icon: domoIcon }).addTo(map);
            marker.bindPopup(`<b>${domo.nombre}</b><br>${domo.direccion}<br>🎥 Domo Móvil 360°<br>Click para ver detalle + fijas`);
            marker.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                openPanel(domo);
            });
        });

        // Línea de referencia Av. Gral Paz (visual)
        const puntosReferencia = [
            [-34.5354, -58.46735], [-34.53914, -58.47588], [-34.54230, -58.48249],
            [-34.54423, -58.48719], [-34.54631, -58.49278], [-34.55043, -58.50042],
            [-34.55810, -58.50374], [-34.56897, -58.50895], [-34.59098, -58.51918],
            [-34.59760, -58.52207], [-34.61496, -58.53088], [-34.62505, -58.53023],
            [-34.63507, -58.52948], [-34.64198, -58.52918], [-34.65121, -58.52868],
            [-34.65667, -58.52503], [-34.66225, -58.51762], [-34.67426, -58.50170],
            [-34.68046, -58.49362], [-34.68646, -58.48454], [-34.69807, -58.47045],
            [-34.70470, -58.46204]
        ];
        L.polyline(puntosReferencia, { 
            color: '#ffaa33', 
            weight: 2.5, 
            opacity: 0.55, 
            dashArray: '6, 8'
        }).addTo(map);

        console.log(`✅ Mapa cargado con ${puntosTriple.length} puntos triple (domos). Cada uno tiene 2 cámaras fijas: Norte → Río de la Plata, Sur → Riachuelo`);
    </script>
